name: Semantic Runtime Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-fixtures:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Run committed offline fixtures
        run: bash scripts/semantic/run-offline-gate.sh
